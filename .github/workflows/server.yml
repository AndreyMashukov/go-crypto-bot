name: server (Go bot engine)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.golangci.yml'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.golangci.yml'
      - '.github/workflows/server.yml'

permissions:
  contents: read

env:
  PKG_CONFIG_PATH: ${{ github.workspace }}/server/src/service/ml/pkg-config
  CGO_ENABLED: '1'

defaults:
  run:
    working-directory: server

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum
      - name: gofmt -l
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt drift in:"
            echo "$diff"
            exit 1
          fi

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum
      - name: install cgo deps (Python 3 dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev pkg-config build-essential
      - run: go vet ./...
        continue-on-error: true

  build:
    name: go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum
      - name: install cgo deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev pkg-config build-essential
      - run: go build ./...
        continue-on-error: true

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum
      - name: install cgo deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev pkg-config build-essential
      - run: go test -count=1 -timeout=120s ./...
        continue-on-error: true

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum
      - name: install cgo deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev pkg-config build-essential
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: server
          args: --config=../.golangci.yml --timeout=3m
        continue-on-error: true

  go-lint:
    name: go-lint (AI-bloat analyzers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum
      - name: install cgo deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev pkg-config build-essential
      - name: install go-lint
        run: go install github.com/AndreyMashukov/go-lint/cmd/go-lint@latest
      - name: run go-lint
        run: go-lint ./...
        continue-on-error: true
