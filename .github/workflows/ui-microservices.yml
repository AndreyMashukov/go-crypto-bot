name: ui/server/microservices (Go services)

on:
  push:
    branches: [main]
    paths:
      - 'ui/server/microservices/**'
      - '.github/workflows/ui-microservices.yml'
  pull_request:
    paths:
      - 'ui/server/microservices/**'
      - '.github/workflows/ui-microservices.yml'

permissions:
  contents: read

jobs:
  signal-server:
    name: signal-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server/microservices/signal-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ui/server/microservices/signal-server/go.sum
      - name: gofmt
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt drift:"
            echo "$diff"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 -timeout=120s ./...
        continue-on-error: true
      - name: go-lint
        run: |
          go install github.com/AndreyMashukov/go-lint/cmd/go-lint@latest
          go-lint ./...
        continue-on-error: true

  sentiment:
    name: sentiment (cgo + python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server/microservices/sentiment
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ui/server/microservices/sentiment/go.sum
      - name: install Python + cgo deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-dev pkg-config build-essential
      - name: gofmt
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt drift:"
            echo "$diff"
            exit 1
          fi
      - run: go vet ./...
        continue-on-error: true
      - run: go build ./...
        continue-on-error: true
      - name: go-lint
        run: |
          go install github.com/AndreyMashukov/go-lint/cmd/go-lint@latest
          go-lint ./...
        continue-on-error: true
