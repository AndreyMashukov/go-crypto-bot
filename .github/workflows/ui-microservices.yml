name: ui/server/microservices (Go services)

on:
  push:
    branches: [main]
    paths:
      - 'ui/server/microservices/**'
      - '.github/workflows/ui-microservices.yml'
  pull_request:
    paths:
      - 'ui/server/microservices/**'
      - '.github/workflows/ui-microservices.yml'

permissions:
  contents: read

jobs:
  signal-server:
    name: signal-server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server/microservices/signal-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ui/server/microservices/signal-server/go.sum
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 -timeout=120s ./...
      - name: go-lint
        run: |
          go install github.com/AndreyMashukov/go-lint/cmd/go-lint@latest
          go-lint ./...

  sentiment:
    name: sentiment (cgo + python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/server/microservices/sentiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ui/server/microservices/sentiment/go.sum
      - name: install python + sklearn (cgo bridge)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-dev python3-pip
          pip3 install --break-system-packages scikit-learn pandas joblib
      - run: gofmt -l . | tee /tmp/fmt.out && test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go build ./...
      - name: go-lint
        run: |
          go install github.com/AndreyMashukov/go-lint/cmd/go-lint@latest
          go-lint ./...
