# CORS conditions
map $http_origin $cors {
	default 0;
	~^https?:\/\/(localhost|127\.0\.0\.1|0\.0\.0\.0|(.+\.)?autotrade\.(local|test|cloud))(:\d+)? 1;
}

server {
    listen 80 default_server;

    send_timeout 300s;

    server_name "";
    root   /srv/www/public;

    proxy_buffer_size  1024k;
    proxy_buffers   4 2056k;
    proxy_busy_buffers_size   2056k;

    set $idx index.php;

    # include /etc/nginx/mime.types;
    # default_type application/octet-stream;

    client_max_body_size 1024m;

    index $idx;

    gzip on;
    gzip_min_length 1000;
    gzip_comp_level 7;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml image/x-icon font/woff2 image/png;

    location ~ ^/(Dockerfile|composer\.json|composer\.lock|Makefile|readme\.md|md_ruleset\.xml|docker-compose\.yaml|config\.auto\.php|\.dockerignore|\.env\.dist|\.env|\.env\.template|\.gitignore|log\/|tests\/|ansible-cd\.yaml|utils) {
        return 403 'Access Denied.';
    }

    location / {
        try_files $uri $uri/ /$idx$is_args$args;
    }

    location ~ \.php$ {
        if ($cors = 1) {
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,X-CSRF-TOKEN,X-XSRF-TOKEN,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Access-Token,X-Requested-With,x-client-name,x-client-version' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Disposition' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PATCH, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        }

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Headers' 'Accept,X-CSRF-TOKEN,X-XSRF-TOKEN,Authorization,Cache-Control,Content-Type,DNT,If-Modified-Since,Keep-Alive,Origin,User-Agent,X-Access-Token,X-Requested-With,x-client-name,x-client-version' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Disposition' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PATCH, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Origin' "$http_origin" always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;

            return 204;
        }

        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name = 404;
        fastcgi_index $idx;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 400;
        fastcgi_param SERVER_NAME $host;
        fastcgi_buffer_size 1024k;
        fastcgi_buffers 4 1024k;
    }

    #access_log off;
    access_log /srv/www/var/log/nginx-access.log;
    error_log  /srv/www/var/log/nginx-error.log;
}
