nelmio_api_doc:
    models:
        use_jms: true

    documentation:
        info:
            title: Autotrade.cloud API
            description: Crypto Trading Platform
            version: 1.16.0
        basePath: /
        schemes:
            - 'https'
        securityDefinitions:
            oauth2:
                type: apiKey
                name: Authorization
                in: header

        definitions:
            InvalidScopeResponse:
                type: object
                properties:
                    error:
                        type: string
                        example: "invalid_scope"
                    error_description:
                        type: string
                        example: "The requested scope is invalid, unknown, or malformed"
                    hint:
                        type: string
                        example: "Check the `scope123` scope"
                    message:
                        type: string
                        example: "The requested scope is invalid, unknown, or malformed"

            InvalidClientResponse:
                type: object
                properties:
                    error:
                        type: string
                        example: "invalid_client"
                    error_description:
                        type: string
                        example: "Client authentication failed"
                    message:
                        type: string
                        example: "Client authentication failed"

            InvalidGrantResponse:
                type: object
                properties:
                    error:
                        type: string
                        example: "unsupported_grant_type"
                    error_description:
                        type: string
                        example: "The authorization grant type is not supported by the authorization server."
                    hint:
                        type: string
                        example: "Check that all required parameters have been provided"
                    message:
                        type: string
                        example: "The authorization grant type is not supported by the authorization server."

            OAuth2TokenBody:
                properties:
                    client_id:
                        type: string
                        example: "e6bb4626807db29f314d568c5bb88d21"
                        description: 'Use `client_id` from this example'
                    client_secret:
                        type: string
                        example: "c77d7230292adaa796517e123f39c8741a113de52de88bdecc5438037df2a2297a1132b08b5f1b3665d65acd072615dcf8483f9aba585bb2c306a9d2deea512d"
                        description: 'Use `client_secret` from this example'
                    grant_type:
                        type: string
                        example: "password"
                    username:
                        type: string
                        example: "test@test.com"
                        description: 'Your email'
                    password:
                        type: string
                        example: "pass123"
                        description: 'Your password'

            OAuth2RefreshBody:
                properties:
                    client_id:
                        type: string
                        example: "e6bb4626807db29f314d568c5bb88d21"
                        description: 'Use `client_id` from this example'
                    client_secret:
                        type: string
                        example: "c77d7230292adaa796517e123f39c8741a113de52de88bdecc5438037df2a2297a1132b08b5f1b3665d65acd072615dcf8483f9aba585bb2c306a9d2deea512d"
                        description: 'Use `client_secret` from this example'
                    grant_type:
                        type: string
                        example: "refresh_token"
                    refresh_token:
                        type: string
                        example: ""

            OAuth2Response:
                type: object
                properties:
                    token_type:
                        type: string
                        example: "Bearer"
                    expires_in:
                        type: integer
                        example: 3600
                    access_token:
                        type: string
                        example: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..l_Jq55sPmxbAgZ3xwqt_uGudrDPNgWz5kRQ02r2uOup2dcB3TDzMCeiE3sUul2BHGq2T3m_VrVVi0jNN8TNWOWKOb1uuUWbb-6wZOCrTUqD0scOeywyYGfcriGcfVG-vyMi5IVgYvTpKMGjQbC1RxyNyqvBjz1HgoyST4aJG_VHFgI6EAp67q_l3cl9LFdP5PX7JxzZexlnXOXviNzuGN7om6nU47WoZbc6nbDL-tGgZArR-frXvUPkI9sms36Un4eIvrGqw5lHZXL2ef8Bbduq_3cZ_mn5JXtvOoxx1GDdqg6hWremMbUmbN_SD002t_tiGbfj_ACoXY06Q_NoSVw"
                    refresh_token:
                        type: string
                        example: ""

            NotFoundResponse:
                type: object
                properties:
                    code:
                        type: integer
                        example: 404
                    message:
                        type: string
                        example: "User is not found."

            CoinSentimentAnalysis:
                type: object
                properties:
                    coin:
                        type: string
                        example: "PERP"
                    score:
                        type: float
                        example: 0.5
                    label:
                        type: string
                        example: "BEARISH"
                    news:
                        type: array
                        items:
                            type: object
                            properties:
                                url:
                                    type: string
                                    example: 'https://bitcoinist.com/bloomberg-analyst-deadline-for-ethereum-spot-etf/'
                                score:
                                    type: float
                                    example: 0.71
                                label:
                                    type: string
                                    example: "BULLISH"

    areas:
        default:
            name_patterns:
                - ^external_api_sentiment_list$
                - ^oauth2_
