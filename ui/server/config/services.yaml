parameters:
    locale: en

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Service\Monitoring\PrometheusQuery\PrometheusQueryService:
        arguments:
            $prometheusUrl: '%env(PROMETHEUS_URL)%'

    App\Service\Monitoring\PrometheusQuery\PrometheusQueryServiceInterface:
        alias: App\Service\Monitoring\PrometheusQuery\PrometheusQueryService

    App\Service\Bot\BotAdminClient:
        arguments:
            $botAdminUrl: '%env(BOT_ADMIN_URL)%'
