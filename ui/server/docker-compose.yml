#            - 5674:5672
#            - 15674:15672
#        restart: always
#        volumes:
#            - ./.docker/rabbitmq/data/:/var/lib/rabbitmq/
#            - ./.docker/rabbitmq/logs/:/var/log/rabbitmq/

volumes:
    pg-data:
        name: crypto-saas_pg_data
    s3data:
        name: crypto-saas_s3_data
    s3metadata:
        name: crypto-saas_s3_metadata

networks:
    crypto-saas:
        driver: bridge
