services:
    backend:
      build:
        context: '.'
        args:
            UID: $UID
            GID: $GID
      environment:
          UID: $UID
          GID: $GID
          APP_ENV: 'dev'
          DEPLOY_SERVICE_IP: 'host.docker.internal'
          MESSENGER_TRANSPORT_DSN: 'amqp://crypto-saas:crypto-saas@rabbit:5672/crypto-saas'
          DATABASE_URL: 'mysql://root:root@mysql:3306/crypto-saas?serverVersion=5.7'
          REDIS_DSN: 'redis://redis'
          ACCESS_TOKEN_TTL: 'P1Y'
          BREVO_API_KEY: ''
          OXA_PAY_API_KEY: 'sandbox'
          BACK_END_HOST: 'http://localhost'
          FRONT_END_HOST: 'http://localhost:3000'
          INTERNAL_SERVICE_TOKEN: 'internal-token'
      volumes:
        - ".:/srv/www"
        - ".docker/etc/php/php-dev.ini:/usr/local/etc/php/conf.d/99-php.ini"

      ports:
        - "81:80"

      networks:
        - crypto-saas
      restart: on-failure
      depends_on:
          - mysql
          - redis
#          - rabbit

    # ssh tunnel: ssh {user}@{server_ip} -L3308:127.0.0.1:3306 -i ~/.ssh/{private_key}
    mysql:
        image: mysql:8.4
        restart: unless-stopped
        ports:
            - "3306:3306"
        networks:
            - crypto-saas
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: crypto-saas
            MYSQL_USER: crypto-saas
            MYSQL_PASSWORD: crypto-saas
        volumes:
            - mysql-data:/var/lib/mysql
            - .docker/etc/mysql/conf:/etc/mysql/mysql.conf.d/mysqld.cnf

    redis:
        image: redis:7-alpine
        networks:
            - crypto-saas
        volumes:
            - ./.docker/data/redis:/data:delegated
        ports:
            - "6378:6379"
        cap_add:
            - SYS_TIME
        restart: always

    # RabbitMQ
#    rabbit:
#        image: amashukov/rabbit3.6-management:latest
#        hostname: "crypto-saas"
#        networks:
#            - crypto-saas
#        environment:
#            RABBITMQ_DEFAULT_VHOST: crypto-saas
#            RABBITMQ_DEFAULT_USER: crypto-saas
#            RABBITMQ_DEFAULT_PASS: crypto-saas
#        cap_add:
#            - SYS_TIME
#        ports:
#            - 5674:5672
#            - 15674:15672
#        restart: always
#        volumes:
#            - ./.docker/rabbitmq/data/:/var/lib/rabbitmq/
#            - ./.docker/rabbitmq/logs/:/var/log/rabbitmq/

volumes:
    mysql-data:
        name: crypto-saas_mysql_data
    s3data:
        name: crypto-saas_s3_data
    s3metadata:
        name: crypto-saas_s3_metadata

networks:
    crypto-saas:
        driver: bridge
